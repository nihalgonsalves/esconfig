name: publish
on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    permissions:
      contents: write # release-please: create tags and GitHub releases
      pull-requests: write # release-please: open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release

  publish:
    if: ${{ needs.release.outputs.release_created }}
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing / provenance
    environment:
      name: NPM
      url: https://www.npmjs.com/package/@nihalgonsalves/esconfig/v/${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # waiting on: https://github.com/actions/setup-node/issues/531
      - run: corepack enable
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm publish --access public
